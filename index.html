<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suez Store</title><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6b53">
  <style>
    body { font-family: sans-serif; background: #f1f4f1; margin: 0; padding: 16px; }
    h1 { color: #0f6b53; }
    input { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; }
    .card { background: white; border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid #d9e0dc; }
    .price { font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Suez Store</h1>
  <input id="search" placeholder="دوّر على منتج">
  <div id="list"></div>

  <script>
    var products = [

        { name: "شاحن ماكسي + 4 حجارة (AA) 2000mAh", price: 1033, qty: 10 }
    ];

    function show() {
      var word = document.getElementById("search").value;
      var html = "";
      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        if (p.name.indexOf(word) >= 0) {
          html += '<div class="card">' +
            '<div>' + p.name + '</div>' +
            '<div class="price">' + p.price + ' جنيه</div>' +
            '<div>' + (p.qty > 0 ? 'متوفر: ' + p.qty : 'خلصان') + '</div>' +
            '</div>';
        }
      }
      document.getElementById("list").innerHTML = html;
    }

    document.getElementById("search").addEventListener("input", show);
    show();if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
